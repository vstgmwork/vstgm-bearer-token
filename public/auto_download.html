<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://qaportal.catchpoint.com/jp/351496/latest/InitialLoadScript.js"></script>
    <title>Automatic Download | VSTGM Testbed</title>
    <style>
        :root { color-scheme: dark; --bg: #08111f; --panel: #12223a; --text: #edf5ff; --muted: #9db0ca; --accent: #72bdff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); background: radial-gradient(circle at 15% 0%, #183969, transparent 34rem), var(--bg); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(680px, 100%); padding: clamp(28px, 6vw, 56px); border: 1px solid #2c476d; border-radius: 24px; background: rgba(18, 34, 58, 0.92); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28); }
        .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; }
        p { color: var(--muted); line-height: 1.6; }
        code { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .status { margin: 24px 0; padding: 16px; border-left: 3px solid var(--accent); background: rgba(114, 189, 255, .09); }
        a { display: inline-block; padding: 12px 18px; border-radius: 999px; color: #06101e; background: var(--accent); font-weight: 800; text-decoration: none; }
        a:hover, a:focus-visible { background: #b4ddff; outline: none; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">VSTGM request-control fixture</p>
        <h1>Automatic download</h1>
        <p>This page initiates a file request as soon as the page finishes loading.</p>
        <div class="status" role="status" aria-live="polite">
            Download request: <code>/auto-download/file.txt</code>
        </div>
        <a id="downloadLink" href="/auto-download/file.txt" download="auto-download.txt">Retry download</a>
    </main>
    <script>
        window.addEventListener("load", function () {
            // Trigger the same-origin file request after the page is fully loaded.
            window.setTimeout(function () {
                document.getElementById("downloadLink").click();
            }, 100);
        });
    </script>
</body>
</html>

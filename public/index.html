<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Developer API Testbed - Simulate HTTP Responses, Delays & Errors</title>
    <meta name="description"
        content="A live collection of REST API endpoints for developers and QA. Test how your application handles various HTTP responses, delays, errors, redirects, and token authentication." />
    <meta name="google-site-verification" content="DPjaLuk4sPmmbh5TRyIT2IJLZM00ImCn9T2Rkgf5ZUM" />

    <!-- Favicon Links -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Modern Styling with Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles & Scripts -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom styles for the performance overlay */
        #performanceOverlay {
            display: none;
            /* Initially hidden */
        }

        .endpoint-matrix {
            border: 1px solid rgb(51 65 85);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .endpoint-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            border-bottom: 1px solid rgb(51 65 85);
        }

        .endpoint-row:last-child {
            border-bottom: 0;
        }

        .endpoint-cell {
            min-width: 0;
            border-right: 1px solid rgb(51 65 85);
        }

        .endpoint-cell:nth-child(4n) {
            border-right: 0;
        }

        .endpoint-trigger {
            width: 100%;
            min-height: 3.75rem;
            padding: 0.95rem 1rem;
            text-align: left;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem;
            color: rgb(203 213 225);
            border: 0;
            background: transparent;
            cursor: pointer;
            transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
            word-break: break-word;
        }

        .endpoint-trigger:hover,
        .endpoint-trigger:focus,
        .endpoint-trigger.is-active {
            color: #ffffff;
            background: rgb(37 99 235);
            outline: none;
            box-shadow: inset 0 -2px 0 rgb(147 197 253);
        }

        .endpoint-detail {
            grid-column: 1 / -1;
            border-top: 1px solid rgb(37 99 235);
            background: rgb(15 23 42);
            padding: 1rem;
        }

        .endpoint-detail-grid {
            display: grid;
            grid-template-columns: minmax(10rem, 16rem) 1fr;
            gap: 1rem;
        }

        @media (max-width: 1024px) {
            .endpoint-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .endpoint-cell:nth-child(2n) {
                border-right: 0;
            }

            .endpoint-cell:nth-child(4n) {
                border-right: 1px solid rgb(51 65 85);
            }
        }

        @media (max-width: 640px) {
            .endpoint-row {
                grid-template-columns: 1fr;
            }

            .endpoint-cell,
            .endpoint-cell:nth-child(4n) {
                border-right: 0;
                border-bottom: 1px solid rgb(51 65 85);
            }

            .endpoint-detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Initial Load Script -->
    <script defer src='https://qaportal.catchpoint.com/jp/351496/latest/InitialLoadScript.js'></script>
    <script defer src="https://gist.github.com/vstgmwork/3f1c7a6f59d62068015d1b66b415ad16.js"></script>
    <script defer src="https://gist.github.com/vstgmwork/c97fe542f3f094da7009021ff648d6c8.js"></script>
    <script defer src="https://gist.github.com/vstgmwork/cd554b93a02e7d7cf2b6c763ca08f9c9.js"></script>
    <script defer src="https://gist.github.com/vstgmwork/1ea4122cf7f1472c19382ce146fc722e.js"></script>
    <!-- VSTGM_PAGE_CONTEXT_SCRIPT -->
</head>

<body class="bg-slate-900 text-slate-300 transition-colors duration-300">

    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Header Section -->
        <header class="text-center mb-12">
            <div class="flex justify-center items-center gap-4 mb-4">
                <img src="/logo.svg" alt="API Testbed Logo" class="h-16 w-16">
                <h1 class="text-4xl md:text-5xl font-bold text-slate-100">Developer API Testbed</h1>
            </div>
            <p class="mt-4 text-lg text-slate-400 max-w-3xl mx-auto">
                A live collection of REST API endpoints for developers and QA. Test how your application handles various
                HTTP
                responses, delays, errors, redirects, and token authentication.
            </p>
        </header>

        <!-- API Endpoints Matrix -->
        <main>
            <div class="bg-slate-800 shadow-lg rounded-xl overflow-hidden">
                <div class="flex flex-col gap-4 border-b border-slate-700 bg-slate-800/90 p-4 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                        <h2 class="text-xl font-semibold text-slate-100">Endpoint Matrix</h2>
                        <p class="mt-1 text-sm text-slate-400">Hover, focus, or tap a path to see details and open it.</p>
                    </div>
                    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                        <label class="sr-only" for="endpointSearch">Search endpoints</label>
                        <input id="endpointSearch" type="search" placeholder="Search endpoints..."
                            class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 sm:w-72" />
                        <div id="endpointCount" class="whitespace-nowrap text-sm font-medium text-slate-400"></div>
                    </div>
                </div>
                <div id="endpointMatrix" class="endpoint-matrix" role="table" aria-label="API endpoint path matrix"></div>
            </div>
        </main>

        <!-- Footer / Actions -->
        <footer class="text-center mt-12">
            <button id="showMetrics"
                class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-transform transform hover:scale-105">
                Show Page Performance Metrics
            </button>
        </footer>
    </div>

    <!-- Performance Metrics Overlay -->
    <div id="performanceOverlay" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-lg shadow-2xl w-full max-w-4xl max-h-full overflow-y-auto relative">
            <button id="closeBtn" class="absolute top-3 right-3 text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            <div class="p-6">
                <h2 class="text-2xl font-bold text-slate-200 mb-4">Performance Metrics</h2>
                <div class="grid md:grid-cols-2 gap-6 text-sm">
                    <div id="leftColumn" class="bg-slate-700 p-4 rounded-md"></div>
                    <div id="rightColumn" class="bg-slate-700 p-4 rounded-md"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Scripts -->
    <script>
        const endpointMatrix = document.getElementById("endpointMatrix");
        const endpointSearch = document.getElementById("endpointSearch");
        const endpointCount = document.getElementById("endpointCount");

        const endpoints = [
            {
                label: "/generate",
                href: "/generate",
                description: "Generates a Bearer token valid for 60 minutes."
            },
            {
                label: "/authenticate",
                href: "/authenticate",
                description: "Validates a Bearer token provided in the Authorization header."
            },
            {
                label: "/response/:code",
                href: "/response/200",
                description: "Returns a response with the specified HTTP status code."
            },
            {
                label: "/:word/echo",
                href: "/test/echo",
                description: "Returns a JSON object echoing the word provided in the path."
            },
            {
                label: "/api/v2/status.json",
                href: "/api/v2/status.json",
                description: "Returns a Statuspage-style summary that rotates between operational and incident states."
            },
            {
                label: "/api/v2/incidents/unresolved.json",
                href: "/api/v2/incidents/unresolved.json",
                description: "Returns zero or one rotating unresolved incident with Statuspage-style fields."
            },
            {
                label: "/api/v2/scheduled-maintenances/active.json",
                href: "/api/v2/scheduled-maintenances/active.json",
                description: "Returns a rotating active maintenance payload for Catchpoint JSON parsing tests."
            },
            {
                label: "/delayload/:time",
                href: "/delayload/10",
                description: "Loads an HTML page after a specified delay in seconds."
            },
            {
                label: "/assetloader",
                href: "/assetloader",
                description: "Loads external JavaScript, local images, and a UTC clock."
            },
            {
                label: "/delayrespcode/:code/:time",
                href: "/delayrespcode/200/5",
                description: "Returns a response with a status code after a specified delay."
            },
            {
                label: "/redirect/:count",
                href: "/redirect/5",
                description: "Performs a 302 redirect the specified number of times."
            },
            {
                label: "/xhrflood",
                href: "/xhrflood",
                description: "Loads a page to run many background XHR requests."
            },
            {
                label: "/xhrburst",
                href: "/xhrburst",
                description: "Loads a page that immediately sends 10 XHR requests."
            },
            {
                label: "/errorsim",
                href: "/errorsim",
                description: "Loads a page with a random error message and a 400 status."
            },
            {
                label: "/randresp",
                href: "/randresp",
                description: "Returns a random 4xx or 5xx client/server error response."
            },
            {
                label: "/delayed600",
                href: "/delayed600",
                description: "Succeeds on the third attempt and fails with status 600 otherwise."
            },
            {
                label: "/bigdata",
                href: "/bigdata",
                description: "Streams a large 350 MB response body."
            },
            {
                label: "/download/:size",
                href: "/download/10k",
                description: "Streams exactly the requested file size and triggers a browser download."
            },
            {
                label: "/cookie-download/folder/0",
                href: "/cookie-download/folder/0",
                description: "Box-like page that uses the vstgm_gt cookie to request a one-time download token."
            },
            {
                label: "/sequence-load/:type/:size/:count",
                href: "/sequence-load/js/8m/3",
                description: "Loads JS or image assets sequentially at the requested size and count."
            },
            {
                label: "/heavy",
                href: "/heavy",
                description: "Loads many large JS, CSS, and SVG assets to create a big waterfall in DevTools."
            },
            {
                label: "/loadajax",
                href: "/loadajax",
                description: "Loads a page with images and an AJAX-powered data field."
            },
            {
                label: "/cdn-dns-failure",
                href: "/cdn-dns-failure",
                description: "Loads a page where one JavaScript host intentionally fails."
            },
            {
                label: "/tbt",
                href: "/tbt",
                description: "Loads a page with higher TBT every hour for three hours, then returns to normal."
            },
            {
                label: "/idcard",
                href: "/idcard",
                description: "Loads a student ID card generator page."
            },
            {
                label: "/pouchid",
                href: "/pouchid",
                description: "Loads a pouch ID card generator with front and back JPEG downloads."
            },
            {
                label: "/popup",
                href: "/popup",
                description: "Loads a page that demonstrates popup windows."
            },
            {
                label: "/authpage",
                href: "/authpage",
                description: "Loads a sample authentication form."
            },
            {
                label: "/basic-auth",
                href: "/basic-auth",
                description: "Shows a native browser Basic Authentication prompt and opens a protected demo site after valid credentials."
            },
            {
                label: "/simulatedl",
                href: "/simulatedl",
                description: "Loads a page that simulates a file download."
            },
            {
                label: "/file-downloads",
                href: "/file-downloads",
                description: "Provides download links for the JPG, GIF, TXT, MHTML, and ICO test files."
            },
            {
                label: "/auto-download",
                href: "/auto-download",
                description: "Initiates a same-origin file download automatically when the page finishes loading."
            },
            {
                label: "/Thingworx/images/ThingworxLogo.png",
                href: "/Thingworx/images/ThingworxLogo.png",
                description: "Redirects through an intermediate URL and then lands on the existing authentication page."
            },
            {
                label: "/mealplanner",
                href: "/mealplanner",
                description: "Loads a weekly meal planner application page."
            },
            {
                label: "/perfmetrics",
                href: "/perfmetrics",
                description: "Loads a page demonstrating performance timing metrics."
            },
            {
                label: "/consent",
                href: "/consent",
                description: "Loads a sample consent form page."
            },
            {
                label: "/spa",
                href: "/spa",
                description: "Loads a single page application with tabbed content."
            },
            {
                label: "/spaasset",
                href: "/spaasset",
                description: "Loads a single page application where JavaScript files load on each tab."
            },
            {
                label: "/csp-child",
                href: "/csp-child",
                description: "Simulates a CSP error by blocking a child script."
            },
            {
                label: "/csp-root",
                href: "/csp-root",
                description: "Simulates CSP errors by blocking all inline content."
            },
            {
                label: "/jpg",
                href: "/jpg",
                description: "Serves a static JPG image."
            },
            {
                label: "/sso-sim",
                href: "/sso-sim",
                description: "Runs a self-contained SSO attempt to credentials fallback simulator."
            },
            {
                label: "/gif",
                href: "/gif",
                description: "Serves a static GIF file."
            },
            {
                label: "/txt",
                href: "/txt",
                description: "Serves a static text file."
            },
            {
                label: "/mhtml",
                href: "/mhtml",
                description: "Serves a static MHTML file."
            },
            {
                label: "/* (any other path)",
                href: null,
                description: "Any other path returns a 400 Invalid route error."
            }
        ];

        let activeEndpointIndex = null;
        let lastColumnCount = 0;
        let restoringEndpointFocus = false;

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getColumnCount() {
            if (window.matchMedia("(max-width: 640px)").matches) return 1;
            if (window.matchMedia("(max-width: 1024px)").matches) return 2;
            return 4;
        }

        function getVisibleEndpoints() {
            const query = endpointSearch.value.trim().toLowerCase();
            if (!query) return endpoints;

            return endpoints.filter((endpoint) => {
                return endpoint.label.toLowerCase().includes(query)
                    || endpoint.description.toLowerCase().includes(query)
                    || (endpoint.href || "").toLowerCase().includes(query);
            });
        }

        function buildDetail(endpoint) {
            const pathContent = endpoint.href
                ? `<a href="${escapeHtml(endpoint.href)}" class="inline-flex rounded-md bg-blue-600 px-3 py-2 font-mono text-sm font-semibold text-white transition-colors hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-300">Open ${escapeHtml(endpoint.label)}</a>`
                : `<span class="inline-flex rounded-md bg-slate-700 px-3 py-2 font-mono text-sm font-semibold text-slate-300">${escapeHtml(endpoint.label)}</span>`;

            return `
                <div class="endpoint-detail" role="row">
                    <div class="endpoint-detail-grid">
                        <div>
                            <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Path</div>
                            <div class="mt-2">${pathContent}</div>
                        </div>
                        <div>
                            <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Description</div>
                            <p class="mt-2 text-sm leading-6 text-slate-300">${escapeHtml(endpoint.description)}</p>
                        </div>
                    </div>
                </div>`;
        }

        function renderEndpointMatrix() {
            const columns = getColumnCount();
            const visibleEndpoints = getVisibleEndpoints();
            const indexedEndpoints = visibleEndpoints.map((endpoint) => ({
                ...endpoint,
                index: endpoints.indexOf(endpoint)
            }));
            const activeIsVisible = indexedEndpoints.some((endpoint) => endpoint.index === activeEndpointIndex);
            const rows = [];

            if (activeEndpointIndex !== null && !activeIsVisible) {
                activeEndpointIndex = null;
            }

            for (let i = 0; i < indexedEndpoints.length; i += columns) {
                rows.push(indexedEndpoints.slice(i, i + columns));
            }

            endpointCount.textContent = `${visibleEndpoints.filter((endpoint) => endpoint.href).length} endpoints`;

            if (!rows.length) {
                endpointMatrix.innerHTML = `
                    <div class="p-6 text-center text-sm text-slate-400">
                        No endpoints match your search.
                    </div>`;
                return;
            }

            endpointMatrix.innerHTML = rows.map((row) => {
                const cells = row.map((endpoint) => {
                    const isActive = endpoint.index === activeEndpointIndex;
                    return `
                        <div class="endpoint-cell" role="cell">
                            <button type="button"
                                class="endpoint-trigger ${isActive ? "is-active" : ""}"
                                data-endpoint-index="${endpoint.index}"
                                aria-expanded="${isActive ? "true" : "false"}">
                                ${escapeHtml(endpoint.label)}
                            </button>
                        </div>`;
                }).join("");

                const activeEndpoint = row.find((endpoint) => endpoint.index === activeEndpointIndex);
                const detail = activeEndpoint ? buildDetail(activeEndpoint) : "";

                return `<div class="endpoint-row" role="row">${cells}${detail}</div>`;
            }).join("");
        }

        function setActiveEndpoint(index, shouldRestoreFocus) {
            if (activeEndpointIndex === index) return;

            activeEndpointIndex = index;
            renderEndpointMatrix();

            if (shouldRestoreFocus) {
                restoringEndpointFocus = true;
                window.setTimeout(() => {
                    const activeTrigger = endpointMatrix.querySelector(`[data-endpoint-index="${index}"]`);
                    if (activeTrigger) {
                        activeTrigger.focus({ preventScroll: true });
                    }
                    restoringEndpointFocus = false;
                }, 0);
            }
        }

        endpointMatrix.addEventListener("mouseover", (event) => {
            const trigger = event.target.closest(".endpoint-trigger");
            if (!trigger) return;
            setActiveEndpoint(Number(trigger.dataset.endpointIndex), false);
        });

        endpointMatrix.addEventListener("focusin", (event) => {
            if (restoringEndpointFocus) return;
            const trigger = event.target.closest(".endpoint-trigger");
            if (!trigger) return;
            setActiveEndpoint(Number(trigger.dataset.endpointIndex), true);
        });

        endpointMatrix.addEventListener("click", (event) => {
            const trigger = event.target.closest(".endpoint-trigger");
            if (!trigger) return;
            setActiveEndpoint(Number(trigger.dataset.endpointIndex), true);
        });

        endpointSearch.addEventListener("input", () => {
            renderEndpointMatrix();
        });

        window.addEventListener("resize", () => {
            const columnCount = getColumnCount();
            if (columnCount !== lastColumnCount) {
                lastColumnCount = columnCount;
                renderEndpointMatrix();
            }
        });

        lastColumnCount = getColumnCount();
        renderEndpointMatrix();

        // Performance Overlay Script
        document.getElementById("showMetrics").addEventListener("click", function () {
            const timing = performance.timing;
            if (!timing) {
                alert("Performance Timing API is not supported in this browser.");
                return;
            }

            // Calculate values
            const connectTime = timing.connectEnd - timing.connectStart;
            const sslTime = timing.secureConnectionStart > 0 ? (timing.connectEnd - timing.secureConnectionStart) : "N/A (HTTP)";

            // Populate left column
            document.getElementById("leftColumn").innerHTML = `
                <h3 class="font-bold text-lg text-slate-300 mb-2">Key Metrics</h3>
                <ul class="space-y-2">
                    <li><strong>Connect Time:</strong> <span class="font-mono text-blue-600">${connectTime} ms</span></li>
                    <li><strong>SSL Time:</strong> <span class="font-mono text-blue-600">${sslTime}${sslTime === 'N/A (HTTP)' ? '' : ' ms'}</span></li>
                </ul>`;

            // Populate right column
            let content = '<h3 class="font-bold text-lg text-slate-300 mb-2">All Timing Events</h3><ul class="space-y-2">';
            for (let key in timing) {
                const value = timing[key];
                if (typeof value === "number" && value > 0) {
                    content += `<li><strong>${key}:</strong> <span class="font-mono text-slate-400">${value}</span></li>`;
                }
            }
            content += "</ul>";
            document.getElementById("rightColumn").innerHTML = content;

            // Show the overlay
            document.getElementById("performanceOverlay").style.display = "flex";
        });

        // Close the overlay
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("performanceOverlay").style.display = "none";
        });
    </script>
</body>

</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://qaportal.catchpoint.com/jp/351496/latest/InitialLoadScript.js"></script>
    <title>Smartphones | VSTGM Testbed</title>
    <style>
        :root { color-scheme: dark; --bg: #08111f; --panel: #12223a; --text: #eff6ff; --muted: #a6b8d0; --accent: #ef3340; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); background: radial-gradient(circle at 20% 10%, rgba(41, 117, 255, .24), transparent 32rem), var(--bg); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(820px, 100%); padding: clamp(32px, 7vw, 72px); border: 1px solid #2d486c; border-radius: 26px; background: rgba(18, 34, 58, .92); box-shadow: 0 24px 70px rgba(0, 0, 0, .25); }
        .eyebrow { margin: 0 0 12px; color: #ff8790; font-size: .76rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 6rem); line-height: .95; letter-spacing: -.055em; }
        p { max-width: 620px; color: var(--muted); line-height: 1.7; }
        .badge { display: inline-block; margin-top: 22px; padding: 9px 13px; border: 1px solid rgba(116, 192, 252, .35); border-radius: 999px; color: #cbe4ff; background: rgba(116, 192, 252, .1); font-size: .85rem; }
        a { display: inline-block; margin-top: 30px; color: #fff; font-weight: 800; text-decoration: none; }
        a:hover, a:focus-visible { color: #ff8790; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Mobile catalog</p>
        <h1>Smartphones</h1>
        <p>This is the target document for the VSTGM Speculation Rules prefetch fixture.</p>
        <div class="badge">Target loaded: /prefetch-sim/smartphones/</div>
        <div class="badge">Server observed request mode: <strong>__VSTGM_REQUEST_PURPOSE__</strong></div>
        <br>
        <a href="/prefetch-sim">← Back to Mobile</a>
    </main>
</body>
</html>
